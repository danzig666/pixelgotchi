name: Publish verified APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.1.0'
        required: true
      sha:
        description: 'Commit on main that passed the Android APK workflow'
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - name: Download verified build and screenshots
        # Only a fully green push run on main (build and both emulator jobs) is released.
        run: |
          gh api "repos/$GH_REPO/actions/workflows/android.yml/runs?head_sha=$SHA&event=push&status=success" > runs.json
          RUN=$(jq -er '[.workflow_runs[] | select(.head_branch == "main")][0].id' runs.json)
          gh run download "$RUN" -n pixelgotchi-apk-and-reports -D artifacts/build
          gh run download "$RUN" -n device-api-37.0 -D artifacts/device
          echo "RUN=$RUN" >> "$GITHUB_ENV"
      - name: Package release
        run: |
          mkdir -p release
          cp artifacts/build/outputs/apk/debug/app-debug.apk release/pixelgotchi-debug.apk
          cp artifacts/device/device-output/pixelgotchi-screenshots/profiles.png release/profiles.png
          cp artifacts/device/device-output/pixelgotchi-screenshots/device-portrait.png release/game-portrait.png
          cp artifacts/device/device-output/pixelgotchi-screenshots/device-landscape.png release/game-landscape.png
          git archive --format=zip --prefix=pixelgotchi/ --output=release/pixelgotchi-source.zip HEAD
          cd release
          sha256sum *.apk *.zip *.png > SHA256SUMS.txt
      - name: Publish downloadable files
        run: |
          { cat docs/RELEASE_NOTES.md; echo; echo "Ellenőrzött GitHub-futás: https://github.com/$GH_REPO/actions/runs/$RUN"; } > notes.md
          gh release create "$TAG" release/pixelgotchi-debug.apk release/pixelgotchi-source.zip \
            release/profiles.png release/game-portrait.png release/game-landscape.png release/SHA256SUMS.txt \
            --target "$SHA" --title "Lili és Léna pixelkedvencei ${TAG#v} (debug)" --notes-file notes.md
